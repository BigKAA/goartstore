{{- if and .Values.enabled .Values.prometheus.enabled .Values.prometheus.storage.storageClass }}
# PVC для хранения данных Prometheus
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "monitoring.fullname" . }}-prometheus-data
  labels:
    {{- include "monitoring.prometheus.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.prometheus.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.prometheus.storage.size }}
{{- end }}
