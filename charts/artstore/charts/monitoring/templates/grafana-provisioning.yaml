{{- if and .Values.enabled .Values.grafana.enabled }}
# Grafana Datasource — автоматическое подключение к Prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-grafana-datasources
  labels:
    {{- include "monitoring.grafana.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ include "monitoring.fullname" . }}-prometheus:{{ .Values.prometheus.port }}
        isDefault: true
        editable: false
---
# Grafana Dashboard Provider — загрузка dashboards из директории
# Dashboards загружаются sidecar-контейнером из ConfigMaps с label grafana_dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring.fullname" . }}-grafana-providers
  labels:
    {{- include "monitoring.grafana.labels" . | nindent 4 }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: artstore
        orgId: 1
        folder: Artstore
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/artstore
          foldersFromFilesStructure: false
{{- end }}
