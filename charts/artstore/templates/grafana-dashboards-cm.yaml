{{- if .Values.monitoring.dashboards.enabled }}
{{/*
Grafana dashboards provisioning через ConfigMaps.
Grafana sidecar обнаруживает ConfigMaps по label и автоматически
загружает JSON-файлы как dashboards.
Каждый dashboard — отдельный ConfigMap для удобства управления.
*/}}

# --- Overview Dashboard ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artstore.fullname" . }}-dashboard-overview
  namespace: {{ include "artstore.namespace" . }}
  labels:
    {{- include "artstore.labels" . | nindent 4 }}
    {{ .Values.monitoring.dashboards.label }}: {{ .Values.monitoring.dashboards.labelValue | quote }}
  annotations:
    grafana_folder: {{ .Values.monitoring.dashboards.folder | quote }}
data:
  artstore-overview.json: |-
    {{- .Files.Get "dashboards/overview.json" | nindent 4 }}

