# Ingester Module — production Helm chart values
# Stateless HTTP-сервис, TLS termination на API Gateway

# --- Образ контейнера ---
registry: harbor.kryukov.lan
image: library/ingester-module
tag: latest
imagePullPolicy: IfNotPresent

# --- Реплики ---
replicas: 2

# --- Сервер ---
port: 8020
logLevel: info
logFormat: json

# --- JWT/JWKS ---
jwt:
  jwksUrl: ""       # обязательный: URL JWKS endpoint Keycloak
  # issuer: ""      # авто-вычисляется из JWKS URL, если не задан
  # jwksRefreshInterval: "15s"
  # leeway: "5s"

# --- Маппинг групп Keycloak → ролей IM ---
rbac:
  adminGroups: "artstore-admins"
  readonlyGroups: "artstore-viewers"

# --- Admin Module HTTP-клиент ---
adminModule:
  url: ""           # обязательный: URL Admin Module (например, http://admin-module:8000)
  # timeout: "10s"  # таймаут HTTP-клиента Admin Module

# --- Keycloak OAuth2 (Client Credentials для SA) ---
oauth:
  tokenUrl: ""      # обязательный: URL Keycloak token endpoint (protocol/openid-connect/token)
  clientId: ""      # обязательный: Client ID для client_credentials grant
  clientSecret: ""  # обязательный: Client Secret для client_credentials grant

# --- SE Upload ---
seUpload:
  # timeout: "10m"   # таймаут загрузки в SE
  # caCertPath: ""   # путь к CA-сертификату для SE (если отличается от общего)

# --- Upload ---
upload:
  maxFileSize: 1073741824  # 1GB — максимальный размер файла
  defaultTtlDays: 30       # TTL по умолчанию для temporary файлов
  maxRetries: 3            # максимальное количество retry при 507

# --- TLS ---
# IM не использует собственный TLS — HTTP внутри кластера,
# TLS termination выполняется на API Gateway.
# CA-сертификат используется для TLS-соединений к JWKS, AM, SE.
tls:
  # Существующий Secret с CA-сертификатом для TLS-соединений
  # Если задан — монтируется в /certs и IM_CA_CERT_PATH=/certs/ca.crt
  caSecret: ""
  # Пропускать проверку TLS-сертификатов при health check (только для dev!)
  skipVerify: false

# --- Dependency health (topologymetrics) ---
dephealth:
  checkInterval: "15s"
  group: "core-modules"
  isEntry: false

# --- Таймауты HTTP-клиентов ---
# Глобальный таймаут для всех исходящих HTTP-запросов.
# Per-client таймауты (если заданы) переопределяют глобальный.
# timeouts:
#   httpClient: "30s"           # IM_HTTP_CLIENT_TIMEOUT (глобальный)
#   jwksClient: ""              # IM_JWKS_CLIENT_TIMEOUT (→ httpClient если пусто)
#   # --- Таймауты HTTP-сервера ---
#   httpRead: "30s"             # IM_HTTP_READ_TIMEOUT
#   httpWrite: "600s"           # IM_HTTP_WRITE_TIMEOUT (увеличен для upload)
#   httpIdle: "120s"            # IM_HTTP_IDLE_TIMEOUT

# --- Graceful shutdown ---
shutdownTimeout: "10s"

# --- HTTPRoute (Gateway API) ---
# Внешний доступ через API Gateway (Envoy Gateway)
# IM использует prefix /upload с URLRewrite для strip prefix
httproute:
  enabled: false
  gatewayName: eg
  gatewayNamespace: envoy-gateway-system
  hostname: "artstore.kryukov.lan"

# --- Дополнительные annotations для pods ---
# Произвольные annotations, добавляемые к pods (помимо Prometheus)
podAnnotations: {}

# --- Prometheus метрики ---
metrics:
  enabled: true
  path: /metrics

# --- Ресурсы контейнера ---
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- Temporary upload volume (emptyDir) ---
# Для буферизации загружаемых файлов перед отправкой в SE
tempUpload:
  sizeLimit: "2Gi"
  mountPath: "/tmp/uploads"
