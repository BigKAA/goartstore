# Secret с секретными переменными окружения Ingester Module
# OAuth client credentials (IM stateless — без DB credentials)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "im.fullname" . }}-secret
  labels:
    {{- include "im.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- OAuth credentials (Client Credentials для SA) ---
  IM_CLIENT_ID: {{ .Values.oauth.clientId | quote }}
  IM_CLIENT_SECRET: {{ .Values.oauth.clientSecret | quote }}
