# ClusterIP Service для доступа к Ingester Module
apiVersion: v1
kind: Service
metadata:
  name: {{ include "im.fullname" . }}
  labels:
    {{- include "im.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "im.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
