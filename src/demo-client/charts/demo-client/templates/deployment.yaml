apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dc.fullname" . }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "dc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Перезапуск pod при изменении конфигурации
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
      labels:
        {{- include "dc.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "dc.fullname" . }}
          image: {{ include "dc.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          envFrom:
            {{- include "dc.configEnvFrom" . | nindent 12 }}
            {{- include "dc.secretEnvFrom" . | nindent 12 }}
          {{- include "dc.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with include "dc.volumeMounts" . }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
      {{- with include "dc.volumes" . }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
