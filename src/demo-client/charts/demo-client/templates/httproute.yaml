{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dc.fullname" . }}
  labels:
    {{- include "dc.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gatewayName }}
      namespace: {{ .Values.httproute.gatewayNamespace }}
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  rules:
    {{- range .Values.httproute.pathPrefixes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . | quote }}
      backendRefs:
        - name: {{ include "dc.fullname" $ }}
          port: {{ $.Values.port }}
    {{- end }}
{{- end }}
