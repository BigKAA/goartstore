# Deployment для Storage Element
# Stateless: все pod-ы равноправны, координация через per-file lock
# Поддерживает replicas > 1 при shared PVC (RWX)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "se.fullname" . }}
  labels:
    {{- include "se.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  {{- if eq (int (.Values.replicas | default 1)) 1 }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "se.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "se.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/scheme: {{ .Values.metrics.scheme | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: storage-element
          image: {{ include "se.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            {{- include "se.envVars" . | nindent 12 }}
          volumeMounts:
            {{- include "se.volumeMounts" . | nindent 12 }}
          {{- include "se.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "se.dataPvcName" . }}
        - name: tls-certs
          secret:
            secretName: {{ include "se.tlsSecretName" . }}
