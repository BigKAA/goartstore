# PVC для данных Storage Element
# При replicas > 1 используется RWX (shared storage),
# при replicas = 1 — RWO (по умолчанию)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "se.dataPvcName" . }}
  labels:
    {{- include "se.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- if gt (int (.Values.replicas | default 1)) 1 }}
    - ReadWriteMany
    {{- else }}
    - ReadWriteOnce
    {{- end }}
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.dataSize }}
