# =============================================================================
# artstore-se — Helm values для Storage Elements тестовой среды
# Stateless архитектура: все экземпляры равноправны, без leader/follower
# =============================================================================

# Namespace для тестовой среды (должен совпадать с artstore-infra)
namespace: artstore-test

# -----------------------------------------------------------------------------
# Docker Registry
# -----------------------------------------------------------------------------
registry: harbor.kryukov.lan/library
seImage: storage-element
seTag: v0.3.0-2
imagePullPolicy: Always

# -----------------------------------------------------------------------------
# TLS — ссылка на secret, созданный artstore-infra (Certificate)
# -----------------------------------------------------------------------------
tls:
  secretName: artstore-test-tls

# -----------------------------------------------------------------------------
# Имя release artstore-infra — для формирования KC service name
# Bitnami KC создаёт service <infraReleaseName>-keycloak
# -----------------------------------------------------------------------------
infraReleaseName: artstore-infra

# -----------------------------------------------------------------------------
# Keycloak
# -----------------------------------------------------------------------------
keycloak:
  realm: artstore

# -----------------------------------------------------------------------------
# Gateway — внешний hostname для доступа к Keycloak через API Gateway
# SE используют этот URL для получения JWKS ключей (эмуляция продакшена)
# -----------------------------------------------------------------------------
gateway:
  hostname: artstore.kryukov.lan

# -----------------------------------------------------------------------------
# Общие настройки SE
# -----------------------------------------------------------------------------
seCommon:
  port: 8010
  logLevel: debug
  logFormat: json
  gcInterval: "30s"
  reconcileInterval: "6h"
  maxFileSize: "10485760"  # 10MB
  maxCapacity: "209715200"  # 200MB (совпадает с dataSize для тестовой среды)
  # Stateless координация
  uploadLockTTL: "120s"
  modeSyncInterval: "10s"
  indexSyncInterval: "15s"  # Уменьшен для тестов (быстрее обнаруживать файлы)
  # Dependency health
  dephealthCheckInterval: "15s"
  dephealthGroup: "storage-element"
  dephealthDepName: "admin-jwks"
  dephealthIsEntry: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# StorageClass для PVC
storageClass: nfs-client

# -----------------------------------------------------------------------------
# SE instances — все Deployment + ClusterIP Service + PVC
# Edit SE с replicas > 1 для тестирования параллельной записи
# Остальные SE с replicas: 1
# При replicas > 1 PVC создаётся с RWX для shared storage
# -----------------------------------------------------------------------------
instances:
  # Edit SE — 2 реплики, shared PVC (RWX), тестирование параллельной записи
  - name: se-edit-1
    storageId: se-edit-1
    mode: edit
    replicas: 2
    dataSize: 200Mi

  - name: se-edit-2
    storageId: se-edit-2
    mode: edit
    replicas: 1
    dataSize: 200Mi

  # RW SE
  - name: se-rw-1
    storageId: se-rw-1
    mode: rw
    replicas: 1
    dataSize: 200Mi

  - name: se-rw-2
    storageId: se-rw-2
    mode: rw
    replicas: 1
    dataSize: 200Mi

  # RO SE — предзагруженные данные (initContainer)
  - name: se-ro
    storageId: se-ro
    mode: ro
    replicas: 1
    dataSize: 200Mi
    initData:
      type: ro-files
      fileCount: 20
      fileSizeKB: 9216  # ~9MB на файл, суммарно ~180MB

  # AR SE — предзагруженные метаданные (initContainer)
  - name: se-ar
    storageId: se-ar
    mode: ar
    replicas: 1
    dataSize: 200Mi
    initData:
      type: ar-metadata
      fileCount: 200
      metadataSize: 943718  # ~921KB на файл, суммарно ~180MB в метаданных
