# HTTPRoute для Ingester Module — внешний доступ через Envoy Gateway (Gateway API).
# Маршрутизирует трафик с artstore.kryukov.lan/upload/* на ingester-module Service
# с strip prefix /upload через URLRewrite.
# TLS termination выполняется на Envoy Gateway.
# Условное включение через .Values.httproute.enabled.
{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingester-module
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "artstore-apps.labels" . | nindent 4 }}
    {{- include "artstore-apps.im.selectorLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httproute.gateway.name }}
      namespace: {{ .Values.httproute.gateway.namespace }}
  hostnames:
    - {{ .Values.httproute.hostname | quote }}
  rules:
    # /upload/api/v1/* → IM /api/v1/* (strip /upload prefix)
    - matches:
        - path:
            type: PathPrefix
            value: /upload/api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1
      backendRefs:
        - name: ingester-module
          port: {{ .Values.ingesterModule.port }}
    # /upload/health/* → IM /health/* (strip /upload prefix)
    - matches:
        - path:
            type: PathPrefix
            value: /upload/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      backendRefs:
        - name: ingester-module
          port: {{ .Values.ingesterModule.port }}
    # /upload/metrics → IM /metrics (strip /upload prefix)
    - matches:
        - path:
            type: PathPrefix
            value: /upload/metrics
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /metrics
      backendRefs:
        - name: ingester-module
          port: {{ .Values.ingesterModule.port }}
{{- end }}
