# =============================================================================
# artstore-apps — Helm values для приложений тестовой среды
# Компоненты: Admin Module, Query Module, Ingester Module
# =============================================================================

# Namespace для тестовой среды (должен совпадать с artstore-infra)
namespace: artstore-test

# -----------------------------------------------------------------------------
# Docker Registry
# -----------------------------------------------------------------------------
registry: harbor.kryukov.lan/library
amImage: admin-module
amTag: v0.3.0-3
qmImage: query-module
qmTag: v0.1.0-6
imImage: ingester-module
imTag: v0.1.0-4
imagePullPolicy: Always

# -----------------------------------------------------------------------------
# TLS — ссылка на secret, созданный artstore-infra (Certificate)
# -----------------------------------------------------------------------------
tls:
  secretName: artstore-test-tls

# -----------------------------------------------------------------------------
# Имя release artstore-infra — для формирования PG/KC service names
# Bitnami KC создаёт service <infraReleaseName>-keycloak
# PostgreSQL service name: postgresql (фиксировано в artstore-infra)
# -----------------------------------------------------------------------------
infraReleaseName: artstore-infra

# -----------------------------------------------------------------------------
# PostgreSQL (параметры подключения к PG из artstore-infra)
# -----------------------------------------------------------------------------
postgresql:
  image: postgres:17-alpine
  port: 5432
  user: artstore
  password: artstore-test-password
  database: artstore

# -----------------------------------------------------------------------------
# Admin Module
# -----------------------------------------------------------------------------
adminModule:
  port: 8000
  logLevel: debug
  logFormat: json
  # Keycloak
  keycloakRealm: artstore
  keycloakClientId: artstore-admin-module
  keycloakClientSecret: admin-module-test-secret
  keycloakSAPrefix: "sa_"
  # JWT
  jwtRolesClaim: "realm_access.roles"
  jwtGroupsClaim: "groups"
  # Маппинг групп → ролей
  roleAdminGroups: "artstore-admins"
  roleReadonlyGroups: "artstore-viewers"
  # Синхронизация
  syncInterval: "5m"
  syncPageSize: "1000"
  saSyncInterval: "5m"
  # topologymetrics
  dephealthCheckInterval: "15s"
  dephealthGroup: "core-modules"
  dephealthIsEntry: false
  # Admin UI
  uiEnabled: "true"
  uiOidcClientId: "artstore-admin-ui"
  uiSessionSecret: "test-session-secret-32bytes-ok!"
  # Внешний URL Keycloak для browser OAuth2 redirects (через Gateway)
  uiKeycloakUrl: "https://artstore.kryukov.lan"
  # Graceful shutdown
  shutdownTimeout: "5s"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# Query Module
# -----------------------------------------------------------------------------
queryModule:
  port: 8030
  logLevel: debug
  logFormat: json
  # Keycloak
  keycloakRealm: artstore
  clientId: artstore-query
  clientSecret: query-test-secret
  # Маппинг групп → ролей
  roleAdminGroups: "artstore-admins"
  roleReadonlyGroups: "artstore-viewers"
  # topologymetrics
  dephealthCheckInterval: "15s"
  dephealthGroup: "core-modules"
  # Graceful shutdown
  shutdownTimeout: "5s"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# Ingester Module
# -----------------------------------------------------------------------------
ingesterModule:
  port: 8020
  logLevel: debug
  logFormat: json
  # Keycloak
  keycloakRealm: artstore
  clientId: artstore-ingester
  clientSecret: ingester-test-secret
  # Маппинг групп → ролей
  roleAdminGroups: "artstore-admins"
  roleReadonlyGroups: "artstore-viewers"
  # SE Upload
  seUploadTimeout: "10m"
  # Upload
  maxFileSize: "1073741824"
  maxRetries: "3"
  defaultTtlDays: "30"
  # topologymetrics
  dephealthCheckInterval: "15s"
  dephealthGroup: "core-modules"
  # Graceful shutdown
  shutdownTimeout: "5s"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# HTTPRoute (Gateway API) — внешний доступ через Envoy Gateway
# AM: /api/v1/*, /health/*, /admin/*, /static/*, /metrics
# QM: /query/* → strip /query prefix
# IM: /upload/* → strip /upload prefix
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Uniproxy — точка входа для мониторинга зависимостей (topologymetrics)
# Subchart: charts/uniproxy (https://github.com/BigKAA/uniproxy)
# isEntry: true — отмечен как точка входа в топологии
# Критические зависимости: Admin Module, Query Module, Ingester Module
# -----------------------------------------------------------------------------
uniproxy:
  image:
    repository: harbor.kryukov.lan/library/uniproxy
    tag: "v0.7.0"
    pullPolicy: Always
  config:
    name: "artstore-uniproxy"
    group: "core-modules"
    checkInterval: "15"
  log:
    format: "json"
    level: "info"
  configFile:
    enabled: true
    content: |
      name: artstore-uniproxy
      group: core-modules
      isEntry: true
      checkInterval: "15"
      dependencies:
        - name: admin-module
          type: http
          url: "http://admin-module.artstore-test.svc.cluster.local:8000"
          critical: true
          healthPath: "/health/ready"
        - name: query-module
          type: http
          url: "http://query-module.artstore-test.svc.cluster.local:8030"
          critical: true
          healthPath: "/health/ready"
        - name: ingester-module
          type: http
          url: "http://ingester-module.artstore-test.svc.cluster.local:8020"
          critical: true
          healthPath: "/health/ready"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# -----------------------------------------------------------------------------
# HTTPRoute (Gateway API) — внешний доступ через Envoy Gateway
# AM: /api/v1/*, /health/*, /admin/*, /static/*, /metrics
# QM: /query/* → strip /query prefix
# IM: /upload/* → strip /upload prefix
# -----------------------------------------------------------------------------
httproute:
  enabled: true
  hostname: artstore.kryukov.lan
  gateway:
    name: eg
    namespace: envoy-gateway-system
